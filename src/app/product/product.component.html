<div class="card" style="width: h-100;">
  <img [src]="product.imgUrl" class="card-img-top" [alt]="product.imgUrl" style="height: 200px; object-fit: cover;">
  <div class="card-body">
    <h5 class="card-title">{{product.productName}}</h5>
    <p class="card-text"><strong>Price: {{product.price}} </strong></p>
    <p class="card-text"><strong>Description: {{product.description}} </strong></p>
    <p class="card-text"><strong> Count: {{product.stockCount}} </strong></p>
    <button href="#" class="btn btn-success w-100" 
    [disabled]="product.stockCount === 0" (click)="addToCart()">Add to cart</button>
  </div>
</div>
